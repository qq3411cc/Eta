name: build-local-speech

# 本机离线识别（ggml/transcribe + Vosk + sherpa-ncnn）移植版构建。
# native 库不随仓库分发：编译前从 Time-IU/Eta 拉取预编译 .so。
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "debug | release"
        required: false
        default: debug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}

      - name: Fetch native libs from Time-IU/Eta
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/ti.tar.gz https://github.com/Time-IU/Eta/archive/refs/heads/main.tar.gz
          mkdir -p /tmp/ti && tar xzf /tmp/ti.tar.gz -C /tmp/ti --strip-components=1
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp -v /tmp/ti/app/src/main/jniLibs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          du -sh app/src/main/jniLibs/arm64-v8a

      - name: Build
        env:
          ETA_RELEASE_STORE_FILE: ${{ secrets.ETA_RELEASE_STORE_FILE }}
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ inputs.variant }}" = "release" ] && [ -n "${ETA_RELEASE_STORE_FILE:-}" ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            ./gradlew :app:assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eta-local-speech-${{ inputs.variant }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Build log on failure
        if: failure()
        run: |
          echo "=== gradle 失败，附最近日志 ==="
          find . -name "*.log" -maxdepth 3 | head
